[project]
name = "seo-task1"
version = "0.3.0"
description = "任務一：Opus 跑在 Hermes Loop，用 7 個讀取 Tool＋1 個 Skill 研究競品 SEO"
requires-python = ">=3.11,<3.14"
dependencies = [
  # Hermes v2026.9.24（commit f97608f）；Hermes 只能 editable 安裝。
  # vendor/ 不進版控：clone 後先跑 python3 scripts/fetch_hermes.py（下載固定 commit、驗 sha256）再 uv sync。
  "hermes-agent",
  "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.8.6"]

[tool.uv.sources]
hermes-agent = { path = "vendor/hermes-agent", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seo_agent"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: 會真的呼叫 Opus（需要 .env 金鑰）；預設不跑，用 -m live 執行"]
addopts = "-m 'not live'"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]  # 行長不強制：中文註解與長字串較多
